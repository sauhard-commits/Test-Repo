<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetPanda Win/Loss Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber: #c8a84b;
      --amber-light: #f5e9c3;
      --gray-bg: #f4f5f7;
      --gray-border: #d1d5db;
      --gray-label: #6b7280;
      --text: #111827;
      --text-light: #4b5563;
      --white: #ffffff;
      --green: #16a34a;
      --red: #dc2626;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --shadow: 0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -2px rgba(0,0,0,0.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--gray-border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    header .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    header .logo span {
      color: var(--amber);
    }

    header .badge {
      background: var(--amber-light);
      color: #92670a;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    .main-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    /* Input Card */
    .input-card {
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: 12px;
      padding: 28px 32px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .input-card h2 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
    }

    input[type="text"], input[type="url"] {
      padding: 10px 12px;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(200,168,75,0.15);
    }

    .btn-analyze {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      background: var(--amber);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-analyze:hover { background: #b8952f; }
    .btn-analyze:active { transform: scale(0.98); }
    .btn-analyze:disabled { background: #d1d5db; cursor: not-allowed; transform: none; }

    /* Progress Steps */
    .progress-card {
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: none;
    }

    .progress-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-light);
    }

    .step-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--gray-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      transition: all 0.3s;
      color: var(--gray-label);
    }

    .step.active .step-icon {
      border-color: var(--amber);
      background: var(--amber-light);
      color: var(--amber);
      animation: pulse 1.5s infinite;
    }

    .step.done .step-icon {
      border-color: var(--green);
      background: #dcfce7;
      color: var(--green);
    }

    .step.error .step-icon {
      border-color: var(--red);
      background: #fee2e2;
      color: var(--red);
    }

    .step.active .step-label { color: var(--text); font-weight: 500; }
    .step.done .step-label { color: var(--green); }
    .step.error .step-label { color: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Error Banner */
    .error-banner {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 14px 18px;
      color: var(--red);
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    /* Results */
    .results-card {
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: none;
    }

    .results-header {
      background: var(--gray-bg);
      border-bottom: 1px solid var(--gray-border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .results-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .outcome-badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .outcome-won { background: #dcfce7; color: #15803d; }
    .outcome-lost { background: #fee2e2; color: #b91c1c; }
    .outcome-unknown { background: #f3f4f6; color: #4b5563; }

    .results-body {
      padding: 28px 32px;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .btn-download:hover { background: #1d4ed8; }

    /* Deal Summary Table */
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .summary-table tr:not(:last-child) td { border-bottom: 1px solid var(--gray-border); }
    .summary-table td { padding: 9px 12px; vertical-align: top; }
    .summary-table td:first-child {
      width: 38%;
      background: var(--gray-bg);
      font-weight: 500;
      color: var(--text-light);
      white-space: nowrap;
    }
    .summary-table td:last-child { color: var(--text); }

    /* Section */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      padding-bottom: 8px;
      border-bottom: 2px solid var(--amber);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .icon { color: var(--amber); }

    .bullets-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .bullets-list li {
      display: flex;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
    }

    .bullets-list li::before {
      content: '•';
      color: var(--amber);
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Quotes */
    .quote-block {
      border-left: 3px solid var(--amber);
      background: var(--amber-light);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      margin: 8px 0;
    }

    .quote-text {
      font-style: italic;
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
    }

    .quote-meta {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    /* Implications */
    .implications-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .impl-card {
      background: var(--gray-bg);
      border: 1px solid var(--gray-border);
      border-radius: 10px;
      padding: 18px;
    }

    .impl-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .impl-subsection { margin-bottom: 12px; }

    .impl-subsection-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    /* Actions */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .action-col-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
    }

    .action-item {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .action-num {
      color: var(--amber);
      font-weight: 700;
      flex-shrink: 0;
      min-width: 18px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--gray-border);
      margin: 24px 0;
    }

    .empty-state {
      color: var(--text-light);
      font-size: 13px;
      font-style: italic;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Fleet<span>Panda</span></div>
  <div class="badge">Win / Loss Analyzer</div>
</header>

<div class="main-container">

  <!-- Input Card -->
  <div class="input-card">
    <h2>Analyze a deal</h2>
    <div class="form-row" style="grid-template-columns: 1fr;">
      <div class="form-group">
        <label for="dealName">Company name</label>
        <input type="text" id="dealName" placeholder="e.g. Acme Fuel" autocomplete="off" />
      </div>
    </div>
    <button class="btn-analyze" id="analyzeBtn" onclick="startAnalysis()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Analyze deal
    </button>
  </div>

  <!-- Error Banner -->
  <div class="error-banner" id="errorBanner"></div>

  <!-- Progress Card -->
  <div class="progress-card" id="progressCard">
    <h3>Running analysis</h3>
    <div class="steps-list">
      <div class="step" id="step1">
        <div class="step-icon" id="step1-icon">1</div>
        <span class="step-label" id="step1-label">Pulling HubSpot data</span>
      </div>
      <div class="step" id="step2">
        <div class="step-icon" id="step2-icon">2</div>
        <span class="step-label" id="step2-label">Searching Avoma for calls</span>
      </div>
      <div class="step" id="step3">
        <div class="step-icon" id="step3-icon">3</div>
        <span class="step-label" id="step3-label">Running win/loss analysis</span>
      </div>
      <div class="step" id="step4">
        <div class="step-icon" id="step4-icon">4</div>
        <span class="step-label" id="step4-label">Building Word doc</span>
      </div>
    </div>
  </div>

  <!-- Results Card -->
  <div class="results-card" id="resultsCard">
    <div class="results-header">
      <span class="results-title" id="resultsTitle">Deal Debrief</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="outcome-badge" id="outcomeBadge"></span>
        <button class="btn-download" id="downloadBtn" onclick="downloadDocx()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download .docx
        </button>
      </div>
    </div>
    <div class="results-body" id="resultsBody"></div>
  </div>

</div>

<script>
  let currentDebrief = null;
  let currentCompanyName = '';
  let currentFilename = '';
  let sseSource = null;

  function uuid() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function setStepState(num, state, label) {
    const stepEl = document.getElementById(`step${num}`);
    const iconEl = document.getElementById(`step${num}-icon`);
    const labelEl = document.getElementById(`step${num}-label`);
    stepEl.className = `step ${state}`;
    if (label) labelEl.textContent = label;
    if (state === 'done') iconEl.innerHTML = '&#10003;';
    else if (state === 'error') iconEl.innerHTML = '&#10007;';
    else iconEl.textContent = num;
  }

  function resetSteps() {
    for (let i = 1; i <= 4; i++) setStepState(i, '');
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorBanner').style.display = 'none';
  }

  async function startAnalysis() {
    const dealName = document.getElementById('dealName').value.trim();

    if (!dealName) {
      showError('Please enter a company name.');
      return;
    }

    hideError();
    currentCompanyName = dealName;
    currentDebrief = null;

    // UI: show progress, hide results
    document.getElementById('analyzeBtn').disabled = true;
    document.getElementById('progressCard').style.display = 'block';
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('resultsBody').innerHTML = '';
    resetSteps();

    const requestId = uuid();

    // Open SSE stream first
    if (sseSource) sseSource.close();
    sseSource = new EventSource(`/progress/${requestId}`);

    sseSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleProgress(data);
    };

    sseSource.onerror = () => {
      sseSource.close();
    };

    // Step 1 activates first; step 2 activates once step 1 is done (sequential)
    setStepState(1, 'active');

    try {
      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dealName, requestId }),
      });

      const json = await res.json();

      if (!res.ok) {
        throw new Error(json.error || 'Unknown server error');
      }

      currentDebrief = json.debrief;
      currentFilename = json.filename;

      renderDebrief(json.debrief, dealName);
    } catch (err) {
      showError(`Analysis failed: ${err.message}`);
      for (let i = 1; i <= 4; i++) {
        const stepEl = document.getElementById(`step${i}`);
        if (stepEl.classList.contains('active')) setStepState(i, 'error');
      }
    } finally {
      document.getElementById('analyzeBtn').disabled = false;
      if (sseSource) { sseSource.close(); sseSource = null; }
    }
  }

  function handleProgress(data) {
    const { step, message } = data;
    const msg = (message || '').toLowerCase();

    if (step === 1) {
      if (msg.includes('retrieved')) {
        setStepState(1, 'done', message);
        setStepState(2, 'active'); // activate Avoma step only after HubSpot done
      } else {
        setStepState(1, 'active', message);
      }
    } else if (step === 2) {
      if (msg.includes('found') || msg.includes('no avoma')) {
        setStepState(2, 'done', message);
      } else {
        setStepState(2, 'active', message);
      }
    } else if (step === 3) {
      if (msg.includes('complete')) {
        setStepState(3, 'done', message);
        setStepState(4, 'active');
      } else {
        setStepState(3, 'active', message);
      }
    } else if (step === 4) {
      if (msg.includes('ready')) {
        setStepState(4, 'done', message);
      }
    } else if (step === 'error') {
      showError(message);
    }
  }

  function safe(val) {
    if (val === null || val === undefined || val === '') return '<span class="empty-state">—</span>';
    if (Array.isArray(val)) return val.length ? val.join('; ') : '<span class="empty-state">—</span>';
    return escHtml(String(val));
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderSummaryTable(s) {
    const outcome = (s.outcome || '').toLowerCase();
    const isLost = outcome === 'lost' || outcome === 'loss';

    const baseRows = [
      ['Account', s.account],
      ['Outcome', s.outcome],
      ['Segment', s.segment],
      ['Business Line', s.businessLine],
      ['Company Size', s.companySize],
      ['Deal Size', s.dealSize],
      ['Deal Time', s.dealTime],
      ['Source', s.source],
    ];

    if (isLost) {
      baseRows.push(
        ['Vendor Lost To', s.vendorLostTo || s.competitorMentions],
        ['Competitor Already Using', s.competitorAlreadyUsing],
        ['Stage Deal Died', s.stageDealDied],
        ['Primary Loss Reason', s.primaryReason],
        ['Secondary Factors', Array.isArray(s.secondaryReasons) ? s.secondaryReasons.join('; ') : s.secondaryReasons],
        ['Confidence', s.confidence],
      );
    } else {
      baseRows.push(
        ['Competitors Beaten', s.competitorMentions],
        ['Primary Win Reason', s.primaryReason],
        ['Secondary Factors', Array.isArray(s.secondaryReasons) ? s.secondaryReasons.join('; ') : s.secondaryReasons],
        ['Confidence', s.confidence],
      );
    }

    let html = '<table class="summary-table">';
    baseRows.forEach(([label, value]) => {
      html += `<tr><td>${escHtml(label)}</td><td>${safe(value)}</td></tr>`;
    });
    html += '</table>';
    return html;
  }

  function renderBulletsAndQuotes(section) {
    if (!section) return '';
    let html = '';
    const bullets = Array.isArray(section.bullets) ? section.bullets.filter(Boolean) : [];
    const quotes = Array.isArray(section.quotes) ? section.quotes.filter(q => q && q.text) : [];
    if (!bullets.length && !quotes.length) return '';

    if (bullets.length) {
      html += '<ul class="bullets-list">';
      bullets.forEach(b => { html += `<li>${escHtml(b)}</li>`; });
      html += '</ul>';
    }

    if (quotes.length) {
      quotes.forEach(q => {
        const meta = [q.speaker, q.timestamp, q.type].filter(Boolean).join(' | ');
        html += `<div class="quote-block">
          <div class="quote-text">"${escHtml(q.text)}"</div>
          ${meta ? `<div class="quote-meta">— ${escHtml(meta)}</div>` : ''}
        </div>`;
      });
    }

    return html;
  }

  const ANALYSIS_SECTIONS = [
    ['problemDefinition', 'Problem Definition'],
    ['requirements', 'Requirements & Must-Haves'],
    ['currentWayOfWorking', 'Current Way of Working'],
    ['productFit', 'Product Fit'],
    ['pricingAndValue', 'Pricing & Value'],
    ['competition', 'Competition'],
    ['salesExecution', 'Sales Execution'],
    ['buyingProcess', 'Buying Process'],
    ['timingAndUrgency', 'Timing & Urgency'],
    ['companySizeFit', 'Company Size & Segment Fit'],
    ['emotionalSignals', 'Emotional & Perception Signals'],
  ];

  function renderAnalysisSections(analysis) {
    let html = '';
    ANALYSIS_SECTIONS.forEach(([key, label]) => {
      const content = renderBulletsAndQuotes((analysis || {})[key]);
      if (!content) return;
      html += `<div class="section">
        <div class="section-title">${escHtml(label)}</div>
        ${content}
      </div>`;
    });
    return html;
  }

  function renderList(items) {
    if (!Array.isArray(items) || !items.length) return '';
    return '<ul class="bullets-list">' + items.map(i => `<li>${escHtml(i)}</li>`).join('') + '</ul>';
  }

  function renderImplSubsection(label, items) {
    const content = renderList(items);
    if (!content) return '';
    return `<div class="impl-subsection">
      <div class="impl-subsection-label">${escHtml(label)}</div>
      ${content}
    </div>`;
  }

  function renderImplications(implications) {
    if (!implications) return '';
    const { product = {}, sales = {}, marketing = {} } = implications;

    const productHtml = [
      renderImplSubsection('Workflows Resonating', product.workflowsResonating),
      renderImplSubsection('Capabilities Requested', product.capabilitiesRequested),
      renderImplSubsection('Features Driving Wins', product.featuresDrivingWins),
      renderImplSubsection('What to Build Next', product.whatToBuildNext),
      renderImplSubsection('Product Gaps Causing Losses', product.productGapsCausingLosses),
    ].join('');

    const salesHtml = [
      renderImplSubsection('Winning Talk Tracks', sales.winningTalkTracks),
      renderImplSubsection('Discovery Questions', sales.discoveryQuestions),
      renderImplSubsection('Repeated Objections', sales.repeatedObjections),
      renderImplSubsection('Demo Moments That Work', sales.demoMomentsThatWork),
      renderImplSubsection('Competitor Counters', sales.competitorCounters),
      renderImplSubsection('Coaching Needed', sales.coachingNeeded),
      renderImplSubsection('What to Say Differently', sales.whatToSayDifferently),
      renderImplSubsection('What to Avoid Saying', sales.whatToAvoidSaying),
    ].join('');

    const marketingHtml = [
      renderImplSubsection('Buyer Language to Reuse', marketing.buyerLanguageToReuse),
      renderImplSubsection('Problem Statements', marketing.problemStatements),
      renderImplSubsection('Workflow Language', marketing.workflowLanguage),
      renderImplSubsection('Quotes for Assets', marketing.quotesForAssets),
      renderImplSubsection('Assets to Create', marketing.assetsToCreate),
      renderImplSubsection('Objections Needing Content', marketing.objectionsNeedingContent),
      renderImplSubsection('Competitors Needing Messaging', marketing.competitorsNeedingMessaging),
      renderImplSubsection('Strongest Claims', marketing.strongestClaims),
      renderImplSubsection('Messages Not Resonating', marketing.messagesNotResonating),
    ].join('');

    if (!productHtml && !salesHtml && !marketingHtml) return '';

    let html = '<div class="implications-grid">';
    if (productHtml) html += `<div class="impl-card"><div class="impl-card-title">&#128187; Product</div>${productHtml}</div>`;
    if (salesHtml)   html += `<div class="impl-card"><div class="impl-card-title">&#128172; Sales</div>${salesHtml}</div>`;
    if (marketingHtml) html += `<div class="impl-card"><div class="impl-card-title">&#128202; Marketing</div>${marketingHtml}</div>`;
    html += '</div>';
    return html;
  }

  function renderActions(actions) {
    if (!actions) return '';
    const sections = [
      ['Quick Wins', actions.quickWins],
      ['Medium-Term', actions.mediumTerm],
      ['Strategic Bets', actions.strategicBets],
    ].filter(([, arr]) => Array.isArray(arr) && arr.length);

    if (!sections.length) return '';

    let html = '<div class="actions-grid">';
    sections.forEach(([label, items]) => {
      html += `<div>
        <div class="action-col-title">${escHtml(label)}</div>`;
      items.forEach((item, i) => {
        html += `<div class="action-item"><span class="action-num">${i + 1}.</span><span>${escHtml(item)}</span></div>`;
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderDebrief(debrief, dealName) {
    const s = debrief.dealSummary || {};
    const account = s.account || dealName;
    const outcome = (s.outcome || 'unknown').toLowerCase();

    // Header
    document.getElementById('resultsTitle').textContent = `${account} — Deal Debrief`;
    const badge = document.getElementById('outcomeBadge');
    badge.textContent = s.outcome || 'Unknown';
    badge.className = 'outcome-badge outcome-' + (outcome.includes('won') || outcome === 'win' ? 'won' : outcome.includes('lost') || outcome === 'loss' ? 'lost' : 'unknown');

    let html = '';

    // Deal Summary
    html += `<div class="section">
      <div class="section-title">Deal Summary</div>
      ${renderSummaryTable(s)}
    </div>`;

    html += '<hr class="divider">';

    // Analysis
    const analysisHtml = renderAnalysisSections(debrief.analysis);
    if (analysisHtml) {
      html += `<div class="section">
        <div class="section-title">Analysis</div>
        ${analysisHtml}
      </div>`;
      html += '<hr class="divider">';
    }

    // Implications
    const implHtml = renderImplications(debrief.implications);
    if (implHtml) {
      html += `<div class="section">
        <div class="section-title">Cross-Functional Implications</div>
        ${implHtml}
      </div>`;
      html += '<hr class="divider">';
    }

    // Actions
    const actionsHtml = renderActions(debrief.recommendedActions);
    if (actionsHtml) {
      html += `<div class="section">
        <div class="section-title">Recommended Actions</div>
        ${actionsHtml}
      </div>`;
    }

    document.getElementById('resultsBody').innerHTML = html;
    document.getElementById('resultsCard').style.display = 'block';
    document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function downloadDocx() {
    if (!currentDebrief) return;
    try {
      const res = await fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ debrief: currentDebrief, companyName: currentCompanyName }),
      });

      if (!res.ok) {
        const json = await res.json().catch(() => ({}));
        showError(`Download failed: ${json.error || res.statusText}`);
        return;
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFilename || 'debrief.docx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      showError(`Download error: ${err.message}`);
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('analyzeBtn').disabled) {
      startAnalysis();
    }
  });
</script>
</body>
</html>
